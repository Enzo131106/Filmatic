name: Vérification de Filmatic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: filmatic_test_root
          MYSQL_DATABASE: filmatic_db
          MYSQL_USER: filmatic_test
          MYSQL_PASSWORD: filmatic_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Vérifier PHP
        run: |
          php --version
          php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Initialiser la base de test
        run: |
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -pfilmatic_test_root < database/filmatic_db.sql
          cat > config.local.php <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1',
              'port' => 3306,
              'database' => 'filmatic_db',
              'username' => 'filmatic_test',
              'password' => 'filmatic_test_password',
          ];
          PHP
      - name: Tester les parcours principaux
        run: |
          php -S 127.0.0.1:8000 > /tmp/filmatic-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/filmatic-server.log' EXIT
          python3 tests/smoke.py
      - name: Capturer la page d'accueil
        run: |
          php -S 127.0.0.1:8000 > /tmp/filmatic-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --silent http://127.0.0.1:8000/ > /dev/null
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --force-device-scale-factor=1 --virtual-time-budget=3000 --screenshot="$PWD/filmatic-accueil.png" http://127.0.0.1:8000/
          test -s filmatic-accueil.png
      - name: Enregistrer la capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: filmatic-accueil
          path: filmatic-accueil.png
          retention-days: 7
          if-no-files-found: error
